  // A crude autorouter. Agents walk a grid on 45-degree headings, laying

  newRoute(W, H, pitch, t) {
    return {

      y: Math.floor(Math.random() * (H / pitch)),
      d: Math.floor(Math.random() * 8),
      pts: null,
      budget: 5 + Math.floor(Math.random() * 9),
      done: false,
      born: t,
      pulse: Math.random(),
      speed: 0.0020 + Math.random() * 0.0034,
      tag: 'URCJLQD'.charAt(Math.floor(Math.random() * 7)) + (1 + Math.floor(Math.random() * 38))

    if (t - this._grow > 55) {
      this._grow = t;
      var active = 0;
      for (var i = 0; i < R.length; i++) {
        if (!R[i].done) { this.stepRoute(R[i], cw, chh, PITCH); active++; }
      }
      while (active < (narrow ? 4 : 3) && R.length < 40) { R.push(this.newRoute(cw, chh, PITCH, t)); active++; }
      while (R.length > 20) R.shift();
    }

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (var i2 = 0; i2 < R.length; i2++) {
      var rt = R[i2];
      if (!rt.pts || rt.pts.length < 2) continue;
      var age = Math.min(1, (t - rt.born) / 1100);

      ctx.beginPath();
      ctx.moveTo(rt.pts[0][0], rt.pts[0][1]);
      for (var j = 1; j < rt.pts.length; j++) ctx.lineTo(rt.pts[j][0], rt.pts[j][1]);
      ctx.strokeStyle = 'rgba(25,24,23,' + (0.15 * age).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      var s0 = rt.pts[0], s1 = rt.pts[rt.pts.length - 1];
      ctx.beginPath(); ctx.arc(s0[0], s0[1], 3.2, 0, TAU);
      ctx.strokeStyle = 'rgba(25,24,23,' + (0.24 * age).toFixed(3) + ')';
      ctx.lineWidth = 1.4; ctx.stroke();
      if (rt.done) {
        ctx.beginPath(); ctx.arc(s1[0], s1[1], 3.2, 0, TAU);
        if (i2 % 3 === 0) { ctx.fillStyle = acc(0.55 * age); ctx.fill(); }
        else { ctx.strokeStyle = 'rgba(25,24,23,' + (0.24 * age).toFixed(3) + ')'; ctx.stroke(); }
      }

      if (!rt.done) continue;

      var segs = [], total = 0;
      for (var k = 1; k < rt.pts.length; k++) {
        var ddx = rt.pts[k][0] - rt.pts[k - 1][0], ddy = rt.pts[k][1] - rt.pts[k - 1][1];
        var L = Math.sqrt(ddx * ddx + ddy * ddy);
        segs.push(L); total += L;
      }
      if (total <= 0) continue;
      rt.pulse += rt.speed * (1 + p * 3);
      if (rt.pulse > 1.3) rt.pulse -= 1.45;
      if (rt.pulse < 0 || rt.pulse > 1) continue;

      for (var tail = 0; tail < 3; tail++) {
        var at = rt.pulse - tail * 0.045;
        if (at < 0) break;
        var want = at * total, acc2 = 0, qx = 0, qy = 0, hit = false;
        for (var m = 0; m < segs.length; m++) {
          if (acc2 + segs[m] >= want) {
            var u = segs[m] > 0 ? (want - acc2) / segs[m] : 0;
            qx = rt.pts[m][0] + (rt.pts[m + 1][0] - rt.pts[m][0]) * u;
            qy = rt.pts[m][1] + (rt.pts[m + 1][1] - rt.pts[m][1]) * u;
            hit = true; break;
          }
          acc2 += segs[m];
        }
        if (!hit) continue;
        ctx.beginPath();
        ctx.arc(qx, qy, 2.9 - tail * 0.6, 0, TAU);
        ctx.fillStyle = acc((0.9 - tail * 0.28) * age);
        ctx.fill();
      }
    }

    // ---------- silkscreen legend, printed over the copper ----------
    var pad = cw < 720 ? 20 : 80;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    var widthOf = function (str, tr) {
      var w = 0;
      for (var a = 0; a < str.length; a++) w += ctx.measureText(str.charAt(a)).width + tr;
      return w - tr;
    };
    var tracked = function (str, rightX, y, tr, col) {
      ctx.fillStyle = col;
      var x = rightX - widthOf(str, tr);
      for (var a = 0; a < str.length; a++) {
        ctx.fillText(str.charAt(a), x, y);
        x += ctx.measureText(str.charAt(a)).width + tr;
      }
    };

    ctx.font = '500 10px "IBM Plex Mono", ui-monospace, monospace';
    for (var n3 = 0; n3 < R.length; n3++) {
      var rr3 = R[n3];
      if (!rr3.done || !rr3.pts || rr3.pts.length < 2 || !rr3.tag) continue;
      var ag3 = Math.min(1, (t - rr3.born) / 1100);
      var ep = rr3.pts[rr3.pts.length - 1];
      ctx.fillStyle = 'rgba(25,24,23,' + (0.28 * ag3).toFixed(3) + ')';
      ctx.fillText(rr3.tag, ep[0] + 8, ep[1] - 7);
    }

    if (cw > 680) {
      var LINES = ['ELECTRONICS', '&', 'COMMUNICATION', 'ENGINEER'];
      var FAM = '700 SIZEpx "IBM Plex Sans", system-ui, sans-serif';
      var probe = 100, probeTr = probe * 0.055;
      ctx.font = FAM.replace('SIZE', probe);
      var wRef = widthOf('COMMUNICATION', probeTr) || 1;
      var size = Math.round(probe * Math.min(cw * 0.44, 560) / wRef);
      var fit = Math.round(chh * 0.60 / (LINES.length * 1.08));
      if (size > fit) size = fit;
      if (size < 16) size = 16;
      var tr2 = size * 0.055;
      var lh = size * 1.08;
      ctx.font = FAM.replace('SIZE', size);

      var rightX = cw - pad;
      var baseY = chh - pad - 40;
      for (var li = 0; li < LINES.length; li++) {
        var yy3 = baseY - (LINES.length - 1 - li) * lh;
        tracked(LINES[li], rightX, yy3, tr2,
                LINES[li] === '&' ? acc(0.40) : 'rgba(25,24,23,0.115)');
      }

      ctx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
      tracked('ROUTED LIVE  \u00B7  NO TWO LOADS ALIKE', rightX, chh - pad + 2, 1.7,
              'rgba(25,24,23,0.26)');
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  words() { return ['SIGNAL', 'NOISE', 'DECISION']; }
  captions() { return ['Something is out there.', 'Most of it is not.', 'Tell them which.']; }

  // Which word is forming right now, and how far along, from section progress.
  wordState(p) {
    var SLOTS = [[0.06, 0.34], [0.37, 0.65], [0.68, 0.97]];
    var best = 0, bi = -1;
    for (var w = 0; w < SLOTS.length; w++) {
      var a = SLOTS[w][0], b = SLOTS[w][1], v = 0;
      if (p >= a && p <= b) {
        var u = (p - a) / (b - a);
        v = u < 0.34 ? u / 0.34 : (u > 0.66 ? (1 - u) / 0.34 : 1);
        if (v < 0) v = 0; else if (v > 1) v = 1;
        v = v * v * (3 - 2 * v);
      }
      if (v > best) { best = v; bi = w; }
    }
    return { i: bi, m: best };
  }

  // Render a word into an offscreen buffer the same size as the dot grid,
  // so each dot can ask "am I inside a letter?" and how much.
  maskFor(word, cols, rows) {
    if (!this._masks) this._masks = {};
    var key = word + '|' + cols + 'x' + rows;
    if (this._masks[key]) return this._masks[key];
    var oc = document.createElement('canvas');
    oc.width = cols; oc.height = rows;
    var o = oc.getContext('2d');
    if (!o) return null;
    o.fillStyle = '#000';
    o.fillRect(0, 0, cols, rows);
    o.fillStyle = '#fff';
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    var fam = '700 SIZEpx "IBM Plex Sans", system-ui, sans-serif';
    var probe = Math.max(8, Math.round(rows * 0.4));
    o.font = fam.replace('SIZE', probe);
    var wide = o.measureText(word).width || 1;
    var size = Math.round(probe * (cols * (cols < 80 ? 0.94 : 0.86)) / wide);
    var cap = Math.round(rows * 0.5);
    if (size > cap) size = cap;
    if (size < 7) size = 7;
    o.font = fam.replace('SIZE', size);
    o.fillText(word, cols / 2, rows / 2);
    var px = o.getImageData(0, 0, cols, rows).data;
    var m = new Float32Array(cols * rows);
    for (var i = 0; i < cols * rows; i++) m[i] = px[i * 4] / 255;
    this._masks[key] = m;
    return m;
  }

  // Three circular waves summed on a grid of dots, evaluated every frame.
  // As the section scrolls, the dots gather into a word and then let go of it.
  drawField(ctx, cv, p, accent, t, vel) {
    var cw = cv.clientWidth, chh = cv.clientHeight;
    if (!cw || !chh) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var bw = Math.round(cw * dpr), bh = Math.round(chh * dpr);
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#EDEAE2';
    ctx.fillRect(0, 0, cw, chh);

    var hx = String(accent).replace('#', '');
    var AR = parseInt(hx.substring(0, 2), 16); if (isNaN(AR)) AR = 176;
    var AG = parseInt(hx.substring(2, 4), 16); if (isNaN(AG)) AG = 69;
    var AB = parseInt(hx.substring(4, 6), 16); if (isNaN(AB)) AB = 36;

    var W = cw, H = chh;
    // Phones get a finer grid so a word still has enough dots across to read;
    // dot size and wobble scale with the grid pitch.
    var GAP = W < 720 ? 7 : 20;
    var DOT = W < 720 ? 0.5 : 1;
    var cols = Math.ceil(W / GAP) + 1;
    var rows = Math.ceil(H / GAP) + 1;

    var ease = Math.max(0, Math.min(1, p / 0.05));
    var drift = t * 0.0009 + (vel || 0) * 0.02;

    var ws = this.wordState(p);
    var morph = ws.m;
    var mask = (ws.i >= 0 && morph > 0.002) ? this.maskFor(this.words()[ws.i], cols, rows) : null;
    if (!mask) morph = 0;

    var sx1 = (0.16 + 0.56 * p) * W, sy1 = (0.26 + 0.34 * Math.sin(p * Math.PI * 1.6)) * H;
    var sx2 = (0.88 - 0.52 * p) * W, sy2 = (0.78 - 0.44 * p) * H;
    var sx3 = (0.50 + 0.28 * Math.sin(p * Math.PI * 2.1)) * W, sy3 = (0.48 + 0.34 * Math.cos(p * Math.PI * 1.7)) * H;

    var lam = W * 0.085 * (1.3 - 0.62 * p);
    var k = (2 * Math.PI) / lam;
    var decay = W * 0.52;
    var TAU = 6.2831853;
    var textRad = GAP * (W < 720 ? 0.46 : 0.40);
    var calm = 1 - 0.72 * morph;        // the waves settle while a word holds
    var glyph = [];
    var crests = [];

    ctx.beginPath();
    for (var r = 0; r < rows; r++) {
      var y = r * GAP;
      var rowOff = r * cols;
      for (var c = 0; c < cols; c++) {
        var x = c * GAP;
        var dx = x - sx1, dy = y - sy1;
        var d = Math.sqrt(dx * dx + dy * dy);
        var f = Math.sin(k * d - drift) / (1 + d / decay);
        dx = x - sx2; dy = y - sy2;
        d = Math.sqrt(dx * dx + dy * dy);
        f += 0.94 * Math.sin(k * d - drift * 1.25) / (1 + d / decay);
        dx = x - sx3; dy = y - sy3;
        d = Math.sqrt(dx * dx + dy * dy);
        f += 0.82 * Math.sin(k * d + drift * 0.8) / (1 + d / decay);
        f *= 0.62;
        if (f > 1) f = 1; else if (f < -1) f = -1;

        var mv = f < 0 ? -f : f;
        var wave = (0.5 + 6.2 * Math.pow(mv, 1.2)) * DOT * ease * calm;

        var g = mask ? mask[rowOff + c] * morph : 0;
        var rad = g > 0 ? wave + (textRad - wave) * g : wave;
        if (rad < 0.35 * DOT) continue;
        var yy = y + f * 7 * DOT * (1 - g);

        if (g > 0.45) { glyph.push(x, yy, rad); continue; }
        if (f > 0.58 && g < 0.2) { crests.push(x, yy, rad); continue; }
        ctx.moveTo(x + rad, yy);
        ctx.arc(x, yy, rad, 0, TAU);
      }
    }
    ctx.fillStyle = 'rgba(25,24,23,' + (0.52 - 0.22 * morph).toFixed(3) + ')';
    ctx.fill();

    if (crests.length) {
      ctx.beginPath();
      for (var q = 0; q < crests.length; q += 3) {
        ctx.moveTo(crests[q] + crests[q + 2], crests[q + 1]);
        ctx.arc(crests[q], crests[q + 1], crests[q + 2], 0, TAU);
      }
      ctx.fillStyle = 'rgba(' + AR + ',' + AG + ',' + AB + ',0.9)';
      ctx.fill();
    }

    if (glyph.length) {
      ctx.beginPath();
      for (var j = 0; j < glyph.length; j += 3) {
        ctx.moveTo(glyph[j] + glyph[j + 2], glyph[j + 1]);
        ctx.arc(glyph[j], glyph[j + 1], glyph[j + 2], 0, TAU);
      }
      ctx.fillStyle = 'rgba(25,24,23,' + (0.30 + 0.68 * morph).toFixed(3) + ')';
      ctx.fill();
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
}

var form = document.querySelector('.contact-form');
if (form) form.addEventListener('submit', function (e) {
  e.preventDefault();
  var d = new FormData(form);
  var body = d.get('message') + '\n\n— ' + d.get('name') + ' (' + d.get('email') + ')';
  window.location.href = 'mailto:Amoghukkadgatri@gmail.com?subject='
    + encodeURIComponent('Portfolio enquiry from ' + d.get('name'))
    + '&body=' + encodeURIComponent(body);
  form.querySelector('.form-note').textContent = 'Opening your mail client — or write to Amoghukkadgatri@gmail.com.';
});

// Close the mobile menu after a pick or on an outside tap.
document.addEventListener('click', function (e) {
  var open = document.querySelector('details.menu[open]');
  if (open && (e.target.closest('.menu-panel a') || !e.target.closest('details.menu'))) {
    open.removeAttribute('open');
  }
});
